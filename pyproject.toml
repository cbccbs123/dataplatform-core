[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-extract"
version = "0.1.0"
requires-python = ">=3.13"
description = "Media metadata extraction, embeddings, and pgvector search"
# 런타임 의존성 = pyproject 단일 정본(requirements.txt 폐지·078 dep 일원화).
# 코어(src.*)가 실제 import 하는 서드파티만 나열(AST 스캔 근거) — 파이프라인 전용(opencv·faster-whisper·
# scenedetect·soundfile·pytesseract·apache-airflow)은 여기 없다(파이프라인 레포 pyproject 소유).
# 이 목록 덕에 `pip install "meta-extract @ git+…@tag"` 한 번으로 코어 런타임 스택이 **전이 설치**되어,
# 파이프라인·백엔드는 코어를 설치하면 psycopg·opensearch-py·torch 등을 자동으로 얻는다.
dependencies = [
    # 코어 런타임(설정·DB·LLM·검증·임베딩)
    "openai>=1.40.0",              # src/llm/client.py (온프레미스 ollama · OpenAI 호환 API)
    "psycopg[binary]>=3.1.0",      # src/database/* (PG17 클라이언트)
    "psycopg-pool>=3.2.0",         # src/database/postgres_util.py (커넥션 풀)
    "python-dotenv>=1.0.1",        # src/config/bootstrap.py (.env 로드)
    "jsonschema>=4.26.0",          # src/registry/ext_meta_field_registry.py (039 ext_meta 값 검증)
    "numpy>=1.26.0",               # src/embedders/* (벡터 연산)
    "requests>=2.32.0",            # src/embedders/text_embedder_api.py (원격 임베딩 API)
    "opensearch-py>=3.0.0",        # src/search/opensearch_sync.py (BM25+kNN 색인/검색)
    # 파일 타입·문서 로딩(src/file/*)
    "python-magic>=0.4.27",        # file_type_detector.py (MIME 탐지)
    "python-docx>=1.1.0",          # data_loader.py (.docx)
    "openpyxl>=3.1.0",             # data_loader.py (.xlsx)
    "python-pptx>=0.6.23",         # data_loader.py (.pptx)
    "pypdf>=4.0.0",                # data_loader.py (.pdf)
    # 임베딩(텍스트·이미지)
    "sentence-transformers>=3.0.0",  # src/embedders/text_embedder.py
    "pillow>=10.0.0",              # image 계열(추출·임베딩)
    "transformers>=4.40.0",        # src/embedders/image_embedder.py (CLIP 등)
    "torch>=2.2.0",                # 임베딩 백엔드
]

[project.optional-dependencies]
# 마이그레이션 실행 전용(코어가 스키마·alembic 소유). src 런타임 import 아님 → 별도 extra 로 분리.
# 코어 셋업: `pip install -e ".[migrate]"` 후 `alembic -c alembic.ini upgrade head`.
# 파이프라인/백엔드는 마이그레이션을 돌리지 않으므로(코어 소유) 이 extra 없이 코어를 설치한다.
migrate = ["alembic>=1.13.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# 🔴 코드가 런타임에 읽는 데이터 파일 — 없으면 **설치본에서 import 가 터진다.**
# `src/relations/prompt.py:36` 이 `Path(__file__).resolve().parent / "taxonomy_seed.json"` 으로
# 읽으므로 wheel 에 함께 담겨야 한다. editable 설치(`pip install -e .`)는 소스 트리를 가리켜
# 문제가 없어서 로컬에서는 드러나지 않고, **비-editable 설치에서만 FileNotFoundError** 가 난다.
# 실제로 파이프라인 CI 가 코어를 처음 실제 설치해 테스트를 돌리자 드러났다(2026-07-29).
# ⚠️ 와일드카드(`*.json`) 대신 **파일명을 명시**한다 — 새 JSON 이 실수로 배포에 섞이는 것도 막는다.
#    시드를 추가하면 여기도 함께 추가해야 한다. `tests/test_package_data.py` 가 누락을 잡는다.
[tool.setuptools.package-data]
"src.relations" = ["taxonomy_seed.json", "subtopic_seed.json"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/alembic/versions", ".specify", "docs", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
