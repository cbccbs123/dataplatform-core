[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-extract"
version = "0.1.0"
requires-python = ">=3.10"
description = "Media metadata extraction, embeddings, and pgvector search"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
