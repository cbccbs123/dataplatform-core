# Alembic 설정 — F-4.1 통합 스키마 마이그레이션.
# DB 접속 정보는 env.py 가 PostgresUtil(POSTGRES_*/DATABASE_URL/POSTGRES_DSN)에서 가져온다.
# 따라서 여기 sqlalchemy.url 은 비워 둔다(env.py 에서 주입).

[alembic]
script_location = migrations/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
